<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Link Generator — Verifying</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #e0e0e0;
      overflow: hidden;
    }

    /* Background grid animation */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(0, 230, 118, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 230, 118, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, 40px); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 20px;
    }

    .card {
      background: rgba(17, 17, 17, 0.9);
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      padding: 40px 36px;
      box-shadow: 
        0 0 80px rgba(0, 230, 118, 0.06),
        0 20px 60px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .shield-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: #666;
    }

    /* Progress bar */
    .progress-wrapper {
      margin-bottom: 28px;
    }

    .progress-track {
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00c853, #00e676, #69f0ae);
      border-radius: 3px;
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
    }

    .progress-label {
      text-align: right;
      font-size: 11px;
      color: #555;
      margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Terminal log */
    .terminal {
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 28px;
      min-height: 140px;
    }

    .terminal-header {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .terminal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .terminal-dot.red { background: #ff5f57; }
    .terminal-dot.yellow { background: #febc2e; }
    .terminal-dot.green { background: #28c840; }

    .log-entry {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.8;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInUp 0.3s ease forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .log-prefix {
      color: #00e676;
    }

    .log-text {
      color: #888;
    }

    .log-status {
      margin-left: auto;
      font-weight: 700;
    }

    .log-status.ok {
      color: #00e676;
    }

    .log-status.loading {
      color: #ffd600;
      animation: blink 0.8s ease infinite;
    }

    .log-status.error {
      color: #ff1744;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Cursor blink */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #00e676;
      animation: cursorBlink 1s step-end infinite;
      vertical-align: middle;
      margin-left: 4px;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Result */
    .result {
      text-align: center;
      display: none;
    }

    .result.show {
      display: block;
      animation: fadeInUp 0.4s ease forwards;
    }

    .result-success h2 {
      font-size: 18px;
      color: #00e676;
      margin-bottom: 8px;
    }

    .result-success p {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    .result-error h2 {
      font-size: 18px;
      color: #ff1744;
      margin-bottom: 12px;
    }

    .btn-retry {
      display: inline-block;
      padding: 14px 36px;
      background: transparent;
      color: #ff1744;
      border: 1px solid #ff1744;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      margin-top: 8px;
    }

    .btn-retry:hover {
      background: rgba(255, 23, 68, 0.1);
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
    }

    /* Redirect countdown */
    .redirect-note {
      font-size: 12px;
      color: #444;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Responsive */
    @media (max-width: 540px) {
      .card {
        padding: 28px 20px;
      }
      .header h1 {
        font-size: 18px;
      }
      .log-entry {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Header -->
      <div class="header">
        <span class="shield-icon">🛡️</span>
        <h1>Secure Link Generator</h1>
        <p>Verifying your session...</p>
      </div>

      <!-- Progress Bar -->
      <div class="progress-wrapper">
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
        <p class="progress-label" id="progressLabel">0%</p>
      </div>

      <!-- Terminal Log -->
      <div class="terminal">
        <div class="terminal-header">
          <div class="terminal-dot red"></div>
          <div class="terminal-dot yellow"></div>
          <div class="terminal-dot green"></div>
        </div>
        <div id="terminalLog"></div>
      </div>

      <!-- Success Result -->
      <div class="result" id="resultSuccess">
        <div class="result-success">
          <h2>✅ Verification Complete</h2>
          <p>Secure token generated successfully.</p>
          <p class="redirect-note" id="redirectNote">Redirecting in 3 seconds...</p>
        </div>
      </div>

      <!-- Error Result -->
      <div class="result" id="resultError">
        <div class="result-error">
          <h2>⚠️ Session Expired</h2>
          <p style="color: #888; margin-bottom: 16px;">Your verification session has expired or is invalid.</p>
          <a href="/" class="btn-retry" id="retryBtn">Try Again</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";

    // Get session_id from URL
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");

    const progressBar = document.getElementById("progressBar");
    const progressLabel = document.getElementById("progressLabel");
    const terminalLog = document.getElementById("terminalLog");
    const resultSuccess = document.getElementById("resultSuccess");
    const resultError = document.getElementById("resultError");
    const redirectNote = document.getElementById("redirectNote");

    function setProgress(percent) {
      progressBar.style.width = percent + "%";
      progressLabel.textContent = percent + "%";
    }

    function addLog(prefix, text, status = "", statusClass = "") {
      const entry = document.createElement("div");
      entry.className = "log-entry";
      entry.innerHTML = `
        <span class="log-prefix">${prefix}</span>
        <span class="log-text">${text}</span>
        ${status ? `<span class="log-status ${statusClass}">${status}</span>` : '<span class="cursor"></span>'}
      `;
      terminalLog.appendChild(entry);
      return entry;
    }

    function updateLog(entry, text, status, statusClass) {
      entry.innerHTML = `
        <span class="log-prefix">›</span>
        <span class="log-text">${text}</span>
        <span class="log-status ${statusClass}">${status}</span>
      `;
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function runVerification() {
      if (!sessionId) {
        addLog("✗", "No session ID provided", "FAIL", "error");
        setProgress(100);
        resultError.classList.add("show");
        return;
      }

      // Step 1: Checking Browser
      setProgress(10);
      const step1 = addLog("›", "Checking Browser...");
      await sleep(1000);
      setProgress(30);
      updateLog(step1, "Checking Browser...", "OK", "ok");

      await sleep(300);

      // Step 2: Validating Ad Views
      setProgress(40);
      const step2 = addLog("›", "Validating Ad Views...");
      await sleep(1200);
      setProgress(65);
      updateLog(step2, "Validating Ad Views...", "OK", "ok");

      await sleep(300);

      // Step 3: Generating Secure Token
      setProgress(70);
      const step3 = addLog("›", "Generating Secure Token...");
      await sleep(800);
      setProgress(85);

      // Step 4: Call the backend API
      try {
        const res = await fetch(`${API_BASE}/verify/${sessionId}`);
        const data = await res.json();

        if (res.ok && data.original_url) {
          setProgress(100);
          updateLog(step3, "Generating Secure Token...", "OK", "ok");

          await sleep(400);
          addLog("✓", "Verification complete", "PASS", "ok");

          await sleep(300);
          resultSuccess.classList.add("show");

          // Countdown redirect
          let countdown = 3;
          const interval = setInterval(() => {
            countdown--;
            redirectNote.textContent = `Redirecting in ${countdown} second${countdown !== 1 ? "s" : ""}...`;
            if (countdown <= 0) {
              clearInterval(interval);
              redirectNote.textContent = "Redirecting now...";
              window.location.href = data.original_url;
            }
          }, 1000);
        } else {
          throw new Error(data.detail || "Verification failed");
        }
      } catch (err) {
        setProgress(100);
        updateLog(step3, "Generating Secure Token...", "FAIL", "error");

        await sleep(300);
        addLog("✗", err.message || "Session expired", "FAIL", "error");

        await sleep(300);
        resultError.classList.add("show");
      }
    }

    // Start verification on page load
    runVerification();
  </script>
</body>
</html>
