events {}

http {
  upstream web_upstream {
    server 127.0.0.1:3000;
  }

  upstream api_upstream {
    server 127.0.0.1:8000;
  }

  # API subdomain mode: api.example.com -> FastAPI root
  server {
    listen 80;
    server_name ~^api\..+$;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
      proxy_pass http://api_upstream;
    }
  }

  # Main domain mode: example.com
  server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Path-based API support (same-domain mode)
    location ^~ /api/ {
      proxy_pass http://api_upstream;
    }

    location ^~ /_next/ { proxy_pass http://web_upstream; }
    location = / { proxy_pass http://web_upstream; }
    location ^~ /l { proxy_pass http://web_upstream; }
    location ^~ /pricing { proxy_pass http://web_upstream; }
    location ^~ /terms { proxy_pass http://web_upstream; }
    location ^~ /privacy { proxy_pass http://web_upstream; }
    location ^~ /login { proxy_pass http://web_upstream; }
    location ^~ /register { proxy_pass http://web_upstream; }
    location ^~ /dashboard { proxy_pass http://web_upstream; }

    # Hot path short-code redirect
    location ~ "^/[A-Za-z0-9_-]{4,32}$" {
      proxy_pass http://api_upstream;
    }

    location / {
      proxy_pass http://web_upstream;
    }
  }
}
