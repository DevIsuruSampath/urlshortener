services:
  web:
    build: ../apps/web
    container_name: paidlink-web
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
      - NEXT_PUBLIC_APP_DOMAIN=example.com
      - NEXT_PUBLIC_ADMIN_DOMAIN=admin.example.com
      - NEXT_PUBLIC_ADS_DOMAIN=adsexample.com
      - NEXT_PUBLIC_SHORT_DOMAIN=exa.com
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

  api:
    build: ../apps/api
    container_name: paidlink-api
    env_file:
      - ../.env
    environment:
      - TIERS_FILE_PATH=/packages/shared/tiers.json
    volumes:
      - ../apps/api:/app
      - ../packages/shared:/packages/shared:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: paidlink-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-paidlink}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: paidlink-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
